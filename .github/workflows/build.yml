name: Build UE4Dump-MCP-Enhance arm64
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Android NDK r29 (仓库硬性要求)
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          mv android-ndk-r29 /e
          echo "ANDROID_NDK=/e/android-ndk-r29" >> $GITHUB_ENV

      - name: Build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DANDROID_STL=c++_static ..
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UE4Dump-MCP
          path: build/lib*.so
