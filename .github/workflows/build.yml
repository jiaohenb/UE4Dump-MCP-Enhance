name: Build UE4Dump-MCP-Enhance arm64
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Android NDK r29
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r29" >> $GITHUB_ENV

      - name: Fix hardcode path in CMakeLists.txt
        run: |
          sed -i "s|E:/ndk/android-ndk-r29|$PWD/android-ndk-r29|g" CMakeLists.txt

      - name: Build
        run: |
          mkdir build && cd build
          cmake -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DANDROID_STL=c++_static ..
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UE4Dump-MCP
          path: build/lib*.so
